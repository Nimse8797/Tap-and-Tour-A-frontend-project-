<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveler Details | Tap and Tour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1519125323398-675f0ddb6308?auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .backdrop {
      backdrop-filter: blur(6px);
      background-color: rgba(255, 255, 255, 0.75);
    }
  </style>
</head>
<body class="text-yellow-800">
  <div class="min-h-screen flex items-center justify-center p-6">
    <form action="pay3.html" method="GET" class="backdrop shadow-2xl rounded-2xl p-8 w-full max-w-xl border border-yellow-300" id="detailsForm">
      <h1 class="text-3xl font-bold text-yellow-700 mb-6 text-center">Traveler Details</h1>

      <div class="space-y-5">
        <div>
          <label for="name" class="block font-semibold">Full Name</label>
          <input type="text" id="name" name="name" required
                 class="w-full mt-1 p-3 rounded-xl border border-yellow-300 focus:ring-yellow-400 focus:border-yellow-400 outline-none">
        </div>

        <div>
          <label for="email" class="block font-semibold">Email</label>
          <input type="email" id="email" name="email" required
                 class="w-full mt-1 p-3 rounded-xl border border-yellow-300 focus:ring-yellow-400 focus:border-yellow-400 outline-none">
        </div>

        <div>
          <label for="phone" class="block font-semibold">Phone Number</label>
          <input type="tel" id="phone" name="phone" required
                 class="w-full mt-1 p-3 rounded-xl border border-yellow-300 focus:ring-yellow-400 focus:border-yellow-400 outline-none">
        </div>

        <div>
          <label for="passengers" class="block font-semibold">Number of Passengers</label>
          <input type="number" id="passengers" name="passengers" min="1" required
                 class="w-full mt-1 p-3 rounded-xl border border-yellow-300 focus:ring-yellow-400 focus:border-yellow-400 outline-none">
        </div>

        <div>
          <label for="date" class="block font-semibold">Travel Date</label>
          <input type="date" id="date" name="date" required
                 class="w-full mt-1 p-3 rounded-xl border border-yellow-300 focus:ring-yellow-400 focus:border-yellow-400 outline-none">
        </div>

        <div>
          <label for="destination" class="block font-semibold">Destination</label>
          <input type="text" id="destination" name="destination" required
                 class="w-full mt-1 p-3 rounded-xl border border-yellow-300 focus:ring-yellow-400 focus:border-yellow-400 outline-none">
        </div>

        <div>
          <label for="requests" class="block font-semibold">Special Requests</label>
          <textarea id="requests" name="requests" rows="3"
                    class="w-full mt-1 p-3 rounded-xl border border-yellow-300 focus:ring-yellow-400 focus:border-yellow-400 outline-none"></textarea>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="terms" name="terms" required class="accent-yellow-600">
          <label for="terms" class="text-sm">I agree to the Terms and Conditions</label>
        </div>

        <button type="submit"
                class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-xl transition duration-300">
          Continue to Booking
        </button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("detailsForm").addEventListener("submit", function () {
      const count = document.getElementById("passengers").value;
      localStorage.setItem("passengerCount", count);
    });
  </script>
</body>
</html>
