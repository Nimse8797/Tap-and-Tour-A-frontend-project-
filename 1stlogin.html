<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAP AND TOURS Login</title>

  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://use.fontawesome.com/releases/v6.5.1/css/all.css" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: url('e..jpeg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 50px;
      position: relative;
    }

    .navbar {
  background-color: rgba(241, 195, 11, 0.75);
  padding: 15px 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

.navbar .container {
  width: 100%;
  max-width: 1200px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}


    .navbar h1 {
      color: #ffffff;
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #d4af37;
    }

    header {
      position: absolute;
      top: 80px;
      left: 30px;
    }

    header h1 {
      color: black;
      font-weight: bold;
      font-size: 2.5rem;
    }

    .brand-heading {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 2.5rem;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      z-index: 1000;
      width: 100%;
    }

    .brand-heading span {
      color: #151616;
      text-shadow: 0 0 5px #0c0c0c, 0 0 20px #0a0a0a;
    }

    .box {
      position: relative;
      width: 400px;
      height: 200px;
      background: linear-gradient(135deg, #f8f9fa, #eae4dc);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      transition: 0.5s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: #ffffff;
      border-radius: 15px;
      border: 2px solid #d4af37;
    }

    .box:hover {
      width: 450px;
      height: 500px;
    }

    .box:hover .login {
      inset: 40px;
    }

    .box:hover .loginBx {
      transform: translateY(0px);
    }

    .login {
      position: absolute;
      inset: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.85);
      color: #2c3e50;
      z-index: 1000;
      border-bottom: 2px solid #d4af37;
      box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: 0.5s;
      overflow: hidden;
    }

    .loginBx {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
      width: 70%;
      transform: translateY(126px);
      transition: 0.5s;
    }

    h2 {
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #1c1c1c;
    }

    h2 i {
      color: #d4af37;
      text-shadow: 0 0 5px #d4af37, 0 0 15px #d4af37;
    }

    input {
      width: 100%;
      padding: 10px 20px;
      outline: none;
      border: none;
      font-size: 1em;
      color: #151414;
      background: #fefafafe;
      border: 2px solid #eae4dc;
      border-radius: 30px;
    }

    input::placeholder {
      color: #0c0c0c;
    }

    input[type="submit"] {
      background: #d4af37;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.5s;
    }

    input[type="submit"]:hover {
      background: #bfa033;
      box-shadow: 0 0 10px #d4af37, 0 0 30px #d4af37;
    }

    .group {
      width: 100%;
      display: flex;
      justify-content: space-between;
    }

    .group a {
      color: #2c3e50;
      text-decoration: none;
    }

    .group a:nth-child(2) {
      color: #d4af37;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .box {
        margin: 0 auto;
      }

      .brand-heading {
        font-size: 2rem;
        top: -60px;
      }

      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="container">
      <h1>TAP AND TOUR</h1>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact Us</a>
        <a href="team.html">Our Team</a>
      </div>
    </div>
  </div>
  

  <header>
    <h1>LET'S GO!!!</h1>
  </header>

  <div class="brand-heading">TAP AND <span>TOUR</span></div>

  <div class="box">
    <div class="login">
      <div class="loginBx">
        <h2>
          <i class="fa-solid fa-right-to-bracket"></i>
          Login
          <i class="fa-solid fa-heart"></i>
        </h2>

        <input type="text" placeholder="Username" id="username" oninput="validateLogin()" />
        <input type="password" placeholder="Password" id="password" oninput="validateLogin()" />

        <form onsubmit="return validateLoginForm()">
          <input type="submit" id="loginBtn" value="Login" disabled />
        </form>

        <div class="group">
          <a href="#">Forgot Password</a>
          <a href="#">Sign up</a>
        </div>

        <div style="margin-top: 10px; font-size: 14px;">
          Don’t have an account?
          <a href="signup.html" style="color: #d4af37; font-weight: 600; text-decoration: none;">Click here to sign up</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function validateLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = !(username && password);
    }

    function validateLoginForm() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert("Please fill in both Username and Password.");
        return false;
      }
      window.location.href = "Map.html"; // Redirect manually
      return false; // prevent default form submit
    }
  </script>
</body>
</html>
