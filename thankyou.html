<head>

  <title>Thank You</title>
  <meta http-equiv="refresh" content="3;url=index.html">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('thankyu.jpg') no-repeat center center fixed;

      display: flex;
      align-items: center;
      justify-content: center;

      background: white;

    h1 {
      color: #27ae60;
      font-size: 32px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      color: #333;
    }

    .redirect-note {
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>✅ Booking Successful!</h1>
    <p>Thank you for booking your tour with Tap and Tour.</p>
    <p class="redirect-note">You will be redirected to the map page shortly...</p>

</html>
