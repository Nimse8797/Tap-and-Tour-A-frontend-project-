<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | Tap and Tour</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body, html {
      height: 100%;
    }

    body {
      background: url('golden.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #faca09;
      color: white;
      padding: 20px 40px;
      text-align: center;
    }

    nav {
      background-color: #000;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    nav a {
      padding: 15px 25px;
      text-decoration: none;
      color: white;
      font-weight: 500;
    }

    nav a:hover {
      background-color: #333;
    }

    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .signup-container {
      max-width: 450px;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .signup-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #a7c4ee;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .form-group input:focus {
      border-color: #d2bc15;
      outline: none;
    }

    .signup-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #f2d515;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .signup-btn:hover {
      background-color: #f0c70f;
    }

    .login-link {
      margin-top: 15px;
      text-align: center;
      font-size: 0.95rem;
    }

    .login-link a {
      color: #f1cb0e;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    footer {
      background-color: #e2bb20;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .toggle-password {
      margin-top: 5px;
      font-size: 0.9rem;
      cursor: pointer;
      color: #333;
      text-align: right;
    }

    .toggle-password:hover {
      color: #f0c70f;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tap and Tour</h1>
    <p>Your Gateway to Hassle-Free Travel</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="faq.html">FAQ</a>
    <a href="team.html">Our Team</a>
    <a href="contact.html">Contact</a>
    <a href="signup.html">Sign Up</a>
  </nav>

  <div class="content">
    <div class="signup-container">
      <h2>Create Your Account</h2>
      <form action="1stlogin.html" method="get">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
            title="Enter a valid email address (e.g. example@domain.com)"
          />
        </div>

        <div class="form-group">
          <label for="password">Create Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            minlength="6"
            required 
          />
          <div class="toggle-password" onclick="togglePassword()">Show Password</div>
        </div>

        <button type="submit" class="signup-btn">Sign Up</button>

        <div class="login-link">
          Already have an account? <a href="1stlogin.html">Log in</a>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Tap and Tour. All rights reserved.</p>
  </footer>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggle = document.querySelector('.toggle-password');
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggle.textContent = "Hide Password";
      } else {
        passwordInput.type = "password";
        toggle.textContent = "Show Password";
      }
    }
  </script>
</body>
</html>
